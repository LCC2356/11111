    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      justify-items: center;
      align-items: start;
      overflow-x: hidden;
      background: #000;
    }

    .app {
      width: 100%;
      display: grid;
      gap: 12px;
      justify-items: center;
      padding: 12px 0 16px;
    }

    /* Static shader background: organic colors are frozen while the flip canvas remains animated. */
    .scene {
      position: relative;
      width: min(100vw, calc((100svh - 210px) * 1.6), 1440px);
      aspect-ratio: 1440 / 900;
      overflow: hidden;
      isolation: isolate;
      container-type: size;
      background: #000;
      --intro-overlay-opacity: 1;
      --frame-layer-opacity: 1;
      --logo-layer-opacity: 1;
      --side-layer-opacity: 1;
      --copy-layer-opacity: 1;
    }

    .background-canvas {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /*
      Figma: Frame 2147238539 — 568.98 × 592.43.
      It is kept as one responsive group so the logo, side labels, flip cards,
      and release copy preserve their exported spacing at every viewport size.
    */
    .hero-content {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: min(86cqw, calc(86cqh * 0.96041), 568.98px);
      aspect-ratio: 568.98 / 592.43;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.71352%;
      transform: translate(-50%, -50%);
      container-type: inline-size;
      pointer-events: none;
    }

    .anniversary-logo {
      width: 15.81778%;
      height: auto;
      aspect-ratio: 90 / 66.45;
      flex: none;
      overflow: visible;
      filter: drop-shadow(.25cqw .25cqw .5cqw rgba(0, 0, 0, .18));
    }

    /* Figma: Frame 48554 — side word + 430px flip group + side word. */
    .countdown-line {
      width: 100%;
      height: 56.71590%;
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 2.20922%;
    }

    .side-word {
      width: 4.56958%;
      flex: none;
      font-family: "FZZhengHeiS-EB-GB", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 4.56958cqw;
      font-weight: 700;
      line-height: 5.62410cqw;
      text-align: center;
      white-space: nowrap;
      background: linear-gradient(97.41deg, #fff -2.85%, #fff 23.91%, #cbfff5 30.87%, #ffe3f7 36.83%, #fff 45.86%, #fff 77.97%, #e9ffe3 83.7%, #fff2c5 86.53%, #fff 96.7%, #fff 108.48%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow: .27624cqw .27624cqw .55249cqw rgba(0, 0, 0, .25);
    }

    /*
      The shader canvas is 448 × 319, while the visible Figma group is
      430 × 293.93. The negative offset preserves the shader's transparent
      bleed without changing the side-label spacing.
    */
    .flip-slot {
      position: relative;
      width: 75.57383%;
      height: 87.47917%;
      flex: none;
      pointer-events: auto;
      filter: drop-shadow(.27555cqw .27555cqw .55110cqw rgba(0, 0, 0, .25));
    }

    .stage {
      position: absolute;
      left: -3.02326%;
      top: -4.42282%;
      z-index: 1;
      width: 104.18605%;
      height: 108.52993%;
      cursor: default;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Figma: Frame 48551 — 369.97 × 145.97. */
    .release-copy {
      width: 65.02250%;
      height: 24.63987%;
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(.22117cqw .22117cqw .44234cqw rgba(0, 0, 0, .25));
      pointer-events: none;
    }

    .release-kicker,
    .release-status {
      width: 100%;
      flex: none;
      font-family: "FZZhengHeiS-EB-GB", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      background: linear-gradient(97.41deg, #fff -2.85%, #fff 23.91%, #cbfff5 30.87%, #ffe3f7 36.83%, #fff 45.86%, #fff 77.97%, #e9ffe3 83.7%, #fff2c5 86.53%, #fff 96.7%, #fff 108.48%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .release-kicker {
      height: 5.62410cqw;
      font-size: 4.56958cqw;
      line-height: 5.62410cqw;
    }

    .release-date {
      width: 100%;
      height: 13.53300cqw;
      margin-top: -1.23027cqw;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "FZHanZhenGuangBiaoS-GB", "FlipClock Barlow Condensed SemiBold", "Arial Narrow", sans-serif;
      font-size: 11.42395cqw;
      font-weight: 700;
      line-height: 13.53300cqw;
      letter-spacing: .01em;
      color: #ffda00;
      white-space: nowrap;
    }

    .release-status {
      height: 6.85437cqw;
      margin-top: -1.23027cqw;
      font-size: 6.85437cqw;
      line-height: 6.85437cqw;
    }

    .stage.real-glass {
      -webkit-backdrop-filter: blur(3.13569px);
      backdrop-filter: blur(3.13569px);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      width: min(calc(100% - 24px), 1440px);
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      background: rgba(8,8,12,.78);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
      color: rgba(255,255,255,.78);

    .hero-content.prelaunch-active.prelaunch-visible {
      --launch-logo-appear-offset: 0px;
      --launch-copy-appear-offset: 0px;
      --launch-logo-opacity: 1;
      --launch-copy-opacity: 1;
    }

    .hero-content.prelaunch-active.prelaunch-settle .flip-stage-slot {
      animation: prelaunch-stage-enter var(--launch-motion-duration, 760ms)
        cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes prelaunch-stage-enter {
      0% {
        opacity: 0;
        transform: translate3d(0, 10px, 0) scale(.955);
      }
      72% {
        opacity: 1;
        transform: translate3d(0, -1px, 0) scale(1.012);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .hero-content.prelaunch-active.prelaunch-settle {
      --launch-logo-scale: 1;
      --launch-logo-translate-y: 0px;
      --launch-logo-appear-offset: 0px;
      --launch-copy-scale: 1;
      --launch-copy-translate-y: 0px;
      --launch-copy-appear-offset: 0px;
      --launch-stage-opacity: 1;
      --launch-stage-scale: 1;
      --launch-stage-translate-y: 0px;
      --launch-side-opacity: 1;
      --launch-side-scale: 1;
    }

    .flip-stage-slot .stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }



    /* React Bits ShinyText adapted to the existing standalone SVG artwork. */
    .prelaunch-shiny-local {
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .hero-content.prelaunch-shiny-active .prelaunch-shiny-local {
      opacity: 1;
    }


  </style>

    <div class="controls">
      <section class="control-group group-preview" aria-label="预览尺寸切换">
        <span class="group-title">预览版本</span>
        <div class="preview-mode-wrap">
          <div class="preview-segmented" role="group" aria-label="电脑版与手机版切换">
            <button id="previewDesktop" class="is-active" type="button" aria-pressed="true">电脑版</button>
            <button id="previewMobile" type="button" aria-pressed="false">手机版</button>
          </div>
          <span id="previewSize" class="preview-size">1440 × 900</span>
        </div>
      </section>

      <section class="control-group group-countdown">
        <span class="group-title">倒数</span>
        <label>目标
          <input id="number" type="number" min="0" max="30" value="14" />
        </label>
        <button id="apply" type="button">从 30 开始</button>
        <button id="next" type="button">−1</button>
      </section>

      <section class="control-group group-card">
        <span class="group-title">卡片</span>
        <label>主题
          <select id="themeMode">
            <option value="0" selected>夜间版</option>
            <option value="1">日间版</option>
          </select>
        </label>
        <span class="control-divider"></span>
        <input id="cardMode" type="hidden" value="1" />
        <span class="material-fixed" title="夜间版固定使用真实透明玻璃；日间版保持黄色卡片">夜间材质：真实玻璃</span>
      </section>

      <section class="control-group group-visibility">
        <span class="group-title">到达目标后出现</span>
        <label class="switch-label" title="开启后，翻页期间隐藏上方 Logo，到达目标数字后淡入">Logo
          <input id="revealLogoAtTarget" type="checkbox" />
        </label>
        <label class="switch-label" title="开启后，翻页期间隐藏左右“还有 / 天”，到达目标数字后淡入">还有 / 天
          <input id="revealSideAtTarget" type="checkbox" />
        </label>
        <label class="switch-label" title="开启后，翻页期间隐藏下方发售信息，到达目标数字后淡入">下方文字组
          <input id="revealCopyAtTarget" type="checkbox" / checked>
        </label>
        <label class="switch-label" title="开启后，翻页期间隐藏页面顶部导航与底部装饰，到达目标数字后淡入">页面上下内容
          <input id="revealFrameAtTarget" type="checkbox" / checked>
        </label>
      </section>

      <section class="control-group group-launch">
        <span class="group-title">前置登场（尝试）</span>
        <label class="switch-label" title="点击开始后，先显示居中的大 Logo 与下方文字组，再回到标准排版">启用
          <input id="launchIntroEnabled" type="checkbox" / checked>
        </label>
        <label title="居中的大 Logo 与文字组从无到有的出现速度">出现速度
          <input id="launchIntroAppear" type="range" min="0.1" max="2" step="0.05" value="0.4" />
          <span id="launchIntroAppearText">0.45s</span>
        </label>
        <label title="居中的大 Logo 与文字组保持不动的时间">停留
          <input id="launchIntroHold" type="range" min="0" max="3" step="0.05" value="1.55" />
          <span id="launchIntroHoldText">1.00s</span>
        </label>
        <label title="Logo 缩回顶部、下方文字组回到标准位置，同时中间翻页出现的速度">回位速度
          <input id="launchIntroSettle" type="range" min="0.1" max="2.5" step="0.05" value="0.65" />
          <span id="launchIntroSettleText">0.80s</span>
        </label>
        <label class="switch-label" title="使用 React Bits ShinyText 的渐变移动逻辑，只叠加在 Logo 与下方文字轮廓中">ShinyText

  <script id="standalone-preset-exporter">
    (() => {
      "use strict";
      const byId = id => document.getElementById(id);
      const read = id => byId(id)?.value ?? "";
      const checked = id => Boolean(byId(id)?.checked);
      const backgroundIds = [
        "bgMotion", "bgPointer", "bgNoise", "bgNoiseSize",
        "bgDaySpeed", "bgDayRange", "bgDaySize",
        "bgDay1", "bgDay2", "bgDay3", "bgDay4",
        "bgNightSpeed", "bgNightRange", "bgNightBlend",
        "bgBlue", "bgGreen", "bgMagenta", "bgPink",
        "bgDodgeCyan", "bgDodgePurple"
      ];

      function captureStandalonePreset() {
        const background = {};
        backgroundIds.forEach(id => {
          const input = byId(id);
          if (!input) return;
          background[id] = input.type === "checkbox" ? input.checked : input.value;
        });
        return {
          target: read("number"),
          theme: read("themeMode"),
          cardMode: read("cardMode"),
          glassStrength: read("opacity"),
          glassTopStart: read("glassTopStart"),
          glassTopEnd: read("glassTopEnd"),
          glassBottomStart: read("glassBottomStart"),
          glassBottomEnd: read("glassBottomEnd"),
          initialSpeed: read("initialSpeed"),
          finalSpeed: read("finalSpeed"),
          slowdownStart: read("slowdownStart"),
          slowdownAmount: read("slowdownAmount"),
          motionBlur: read("motionBlur"),
          startHold: read("startHoldNumber"),
          launchIntroEnabled: checked("launchIntroEnabled"),
          launchIntroAppear: read("launchIntroAppear"),
          launchIntroHold: read("launchIntroHold"),
          launchIntroSettle: read("launchIntroSettle"),
          launchShinyEnabled: checked("launchShinyEnabled"),
          launchShinySpeed: read("launchShinySpeed"),
          launchShinyDelay: read("launchShinyDelay"),
          launchShinySpread: read("launchShinySpread"),
          launchShinyDirection: read("launchShinyDirection"),
          launchShinyYoyo: checked("launchShinyYoyo"),
          launchShinyColor: read("launchShinyColor"),
          revealLogoAtTarget: checked("revealLogoAtTarget"),
          revealSideAtTarget: checked("revealSideAtTarget"),
          revealCopyAtTarget: checked("revealCopyAtTarget"),
          revealFrameAtTarget: checked("revealFrameAtTarget"),
          background
        };
      }

      async function savePreset(event) {
        event.preventDefault();
        event.stopImmediatePropagation();
        const name = byId("presetName")?.value.trim() ||
          byId("presetSelect")?.selectedOptions?.[0]?.textContent?.trim() || "0804";
        const payload = {
          format: "figma-flip-clock-preset",
          version: 1,
          app: "Figma Flip Clock Shader — Day / Night",
          name,
          exportedAt: new Date().toISOString(),
          instructions: "在完整调试版中点击“导入预设文件”即可还原全部参数。",
          settings: captureStandalonePreset()
        };
        const json = JSON.stringify(payload, null, 2);
        const safeName = (name || "0804").replace(/[\/:*?"<>|]+/g, "-");
        const fileName = safeName + ".json";
        const blob = new Blob([json], { type: "application/json;charset=utf-8" });
        window.__lastExportedPreset = payload;
        window.__lastExportedPresetJson = json;
        const status = byId("presetStatus");
        const button = byId("exportPreset");
        let saved = false;

        if (typeof window.showSaveFilePicker === "function") {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{ description: "JSON 预设文件", accept: { "application/json": [".json"] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            saved = true;
          } catch (error) {
            if (error?.name !== "AbortError") console.warn(error);
          }
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        link.rel = "noopener";
        link.textContent = saved ? "再次下载" : "点击下载预设 JSON";
        if (!saved) {
          const auto = link.cloneNode(true);
          auto.style.display = "none";
          document.body.appendChild(auto);
          auto.click();
          auto.remove();
        }
        if (status) {
          status.replaceChildren(saved ? "已保存。" : "已生成；若未自动下载，请");
          status.appendChild(link);
          const copy = document.createElement("button");
          copy.type = "button";
          copy.textContent = "复制 JSON";
          copy.style.marginLeft = "8px";
          copy.onclick = async () => {
            try { await navigator.clipboard.writeText(json); }
            catch (_) {
              const t = document.createElement("textarea");
              t.value = json; t.style.position = "fixed"; t.style.opacity = "0";
              document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
            }
            copy.textContent = "已复制";
          };
          status.appendChild(copy);
        }
        if (button) {
          const old = button.textContent;
          button.textContent = saved ? "已保存" : "已生成";
          setTimeout(() => { button.textContent = old; }, 1400);
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }

      const bind = () => {
        const button = byId("exportPreset");
        if (button && !button.dataset.standaloneExporterBound) {
          button.dataset.standaloneExporterBound = "true";
          button.addEventListener("click", savePreset, true);
        }
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind, { once: true });
      else bind();
    })();
  </script>

  <script>
    (async () => {
      "use strict";

      const canvas = document.querySelector("#gl");
      const stage = document.querySelector("#stage");
      const errorBox = document.querySelector("#error");

      const gl = canvas.getContext("webgl", {
        alpha: true,
        antialias: true,
        /*
          iOS Safari and embedded WKWebView compositors expect transparent
          WebGL surfaces to use premultiplied colour. Matching that contract
          prevents low-alpha cyan glass from being amplified into opaque
          white/cyan blocks on mobile.
        */
        premultipliedAlpha: true,
        preserveDrawingBuffer: false
      });

      if (!gl) {
        errorBox.style.display = "block";
        errorBox.textContent = "当前浏览器没有启用 WebGL，无法显示 shader。";
        return;
      }

      const vertexSource = `
        attribute vec2 a_position;
        varying vec2 v_uv;

        void main() {
          v_uv = a_position * 0.5 + 0.5;
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `
        precision highp float;

        varying vec2 v_uv;
        uniform sampler2D u_digits;
        uniform vec2 u_from;
        uniform vec2 u_to;
        uniform float u_progress;
        uniform float u_time;
        uniform vec2 u_mouse;
        uniform vec2 u_resolution;
        uniform float u_cardMode;
        uniform float u_glassOpacity;
        uniform float u_theme;
        uniform float u_motionBlur;
        uniform float u_flipSpeed;
        uniform vec3 u_glassTopStart;
        uniform vec3 u_glassTopEnd;
        uniform vec3 u_glassBottomStart;
        uniform vec3 u_glassBottomEnd;

        const vec2 VIEW = vec2(448.0, 319.0);
        const vec2 GROUP = vec2(430.0, 293.93);
        const vec2 GROUP_ORIGIN = vec2(13.0, 13.0);
        const vec3 NIGHT_DIGIT = vec3(1.0, 218.0 / 255.0, 0.0);
        const vec3 DAY_CARD = vec3(1.0, 218.0 / 255.0, 0.0);
        const vec3 DAY_DIGIT = vec3(16.0, 24.0, 32.0) / 255.0;

        float roundedBoxSDF(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - b + r;
          return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
        }

        float digitMask(float digit, vec2 uv) {
          if (digit < -0.5) return 0.0;
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 0.0;
          /*
            The exact uploaded TTF was rasterized into a 5 × 2 atlas.
            Both atlas and Figma-local UVs use a top-left origin.
          */
          float column = mod(digit, 5.0);
          float row = floor(digit / 5.0);
          vec2 atlasUV = vec2((column + uv.x) / 5.0, (row + uv.y) / 2.0);
          return texture2D(u_digits, atlasUV).a;
        }

        float digitMaskMotionBlur(
          float digit,
          vec2 uv,
          float blurStrength
        ) {
          /*
            A seven-tap vertical shutter blur is only used on the moving flap.
            Static card faces still use the untouched atlas sample, so numbers
            settle back to the exact Figma sharpness after every flip.
          */
          if (blurStrength <= 0.0001) {
            return digitMask(digit, uv);
          }
          /*
            Use a wider eleven-tap shutter kernel. blurStrength is compensated
            for flap compression at the call site, so the blur remains visible
            in screen space instead of collapsing with the folding surface.
          */
          float radius = min(blurStrength, 8.0) * (12.0 / 305.28);
          float mask = digitMask(digit, uv) * 0.16;
          mask += digitMask(digit, uv + vec2(0.0, radius * 0.20)) * 0.15;
          mask += digitMask(digit, uv - vec2(0.0, radius * 0.20)) * 0.15;
          mask += digitMask(digit, uv + vec2(0.0, radius * 0.42)) * 0.12;
          mask += digitMask(digit, uv - vec2(0.0, radius * 0.42)) * 0.12;
          mask += digitMask(digit, uv + vec2(0.0, radius * 0.66)) * 0.08;
          mask += digitMask(digit, uv - vec2(0.0, radius * 0.66)) * 0.08;
          mask += digitMask(digit, uv + vec2(0.0, radius * 0.86)) * 0.05;
          mask += digitMask(digit, uv - vec2(0.0, radius * 0.86)) * 0.05;
          mask += digitMask(digit, uv + vec2(0.0, radius)) * 0.02;
          mask += digitMask(digit, uv - vec2(0.0, radius)) * 0.02;
          return clamp(mask, 0.0, 1.0);
        }

        vec3 simulatedBackdrop(vec2 uv, float side) {
          float groupX =
            (mix(0.0, 220.29, side) + uv.x * 209.72) / GROUP.x;
          float lowerGlow = smoothstep(0.20, 1.0, uv.y);
          float rightGlow = smoothstep(0.20, 1.0, groupX);
          float leftCyan = (1.0 - smoothstep(0.05, 0.72, groupX)) * lowerGlow;

          vec3 backdrop = vec3(0.004, 0.008, 0.022);
          backdrop += vec3(0.00, 0.13, 0.46) * lowerGlow;
          backdrop += vec3(0.20, 0.035, 0.32) * rightGlow * (1.0 - uv.y * 0.42);
          backdrop += vec3(0.00, 0.20, 0.26) * leftCyan * 0.60;
          return clamp(backdrop, 0.0, 1.0);
        }

        vec4 figmaGlassMaterial(vec2 uv) {
          float upperHalf = 1.0 - step(0.5, uv.y);
          float lowerHalf = step(0.5, uv.y);
          float topT = clamp(uv.y / 0.5, 0.0, 1.0);
          float bottomT = clamp((uv.y - 0.5) / 0.5, 0.0, 1.0);

          /*
            Rectangle 2781:
            cyan at 20% alpha through 19.71%, fading to transparent.
          */
          float upperFade = smoothstep(0.1971, 1.0, topT);
          float upperAlpha = 0.20 * (1.0 - upperFade);
          vec3 upperColor = mix(
            u_glassTopStart,
            u_glassTopEnd,
            upperFade
          );

          /*
            Rectangle 2779:
            cyan 20% overlay fading downward over a persistent lavender
            layer at 16% alpha. This reproduces the two CSS backgrounds
            rather than treating the card as translucent black.
          */
          float lowerFade = smoothstep(0.0, 1.0, bottomT);
          float overlayAlpha = 0.20 * (1.0 - lowerFade);
          float baseAlpha = 0.16;
          vec3 overlayColor = mix(
            u_glassBottomStart,
            u_glassBottomEnd,
            lowerFade
          );
          vec3 baseColor = u_glassBottomEnd;
          float lowerAlpha =
            overlayAlpha + baseAlpha * (1.0 - overlayAlpha);
          vec3 lowerColor = (
            overlayColor * overlayAlpha +
            baseColor * baseAlpha * (1.0 - overlayAlpha)
          ) / max(lowerAlpha, 0.0001);

          vec3 color =
            upperColor * upperHalf + lowerColor * lowerHalf;
          float alpha =
            upperAlpha * upperHalf + lowerAlpha * lowerHalf;
          return vec4(color, alpha);
        }

        vec3 cardSurface(vec2 uv, float side) {
          vec3 black = vec3(0.0);
          vec3 lavender = vec3(194.0, 209.0, 255.0) / 255.0;
          vec3 cyan = vec3(127.0, 217.0, 255.0) / 255.0;

          float upperHalf = 1.0 - step(0.5, uv.y);
          float lowerHalf = step(0.5, uv.y);
          float topT = clamp(uv.y / 0.5, 0.0, 1.0);
          float bottomT = clamp((uv.y - 0.5) / 0.5, 0.0, 1.0);

          /*
            Rectangle 2781:
            linear-gradient(180deg, rgba(127,217,255,.2) 20%, transparent 100%),
            #000.
          */
          float topCyanAlpha = upperHalf * 0.20 * (1.0 - smoothstep(0.20, 1.0, topT));

          /*
            Rectangle 2779:
            left card is tilted 1.33deg; right card is 180deg.
            Both fade from cyan at the fold to transparent at the bottom.
          */
          float tiltedBottomT = clamp(bottomT + (1.0 - side) * (uv.x - 0.5) * 0.0232, 0.0, 1.0);
          float bottomCyanAlpha = lowerHalf * 0.20 * (1.0 - smoothstep(0.0, 1.0, tiltedBottomT));

          vec3 upper = mix(black, cyan, topCyanAlpha);
          vec3 lower = mix(black, lavender, 0.16);
          lower = mix(lower, cyan, bottomCyanAlpha);
          vec3 nightSurface = upper * upperHalf + lower * lowerHalf;

          /*
            Mode 2 keeps the card opaque and mixes a sampled-looking blue /
            purple backdrop into the material to simulate translucency.
          */
          float overlayMode = step(1.5, u_cardMode);
          nightSurface = mix(
            nightSurface,
            simulatedBackdrop(uv, side),
            overlayMode * 0.48
          );

          /*
            Mode 1 switches to the exact Figma transparent layer colors.
            Four color stops still allow independent upper/lower gradients.
          */
          float glassMode =
            step(0.5, u_cardMode) * (1.0 - step(1.5, u_cardMode));
          vec4 glass = figmaGlassMaterial(uv);
          nightSurface = mix(nightSurface, glass.rgb, glassMode);

          /*
            Day mode:
            white at 40% fades over the #FFDA00 card. The lower-left card
            retains the supplied 1.33deg tilt through tiltedBottomT.
          */
          float dayTopAlpha =
            upperHalf * 0.40 *
            (1.0 - smoothstep(0.1971, 1.0, topT));
          float dayBottomAlpha =
            lowerHalf * 0.40 *
            (1.0 - smoothstep(0.0, 1.0, tiltedBottomT));
          vec3 dayUpper = mix(DAY_CARD, vec3(1.0), dayTopAlpha);
          vec3 dayLower = mix(DAY_CARD, vec3(1.0), dayBottomAlpha);
          vec3 daySurface =
            dayUpper * upperHalf + dayLower * lowerHalf;

          return mix(nightSurface, daySurface, step(0.5, u_theme));
        }

        vec4 digitLayerOpacity(
          vec3 base,
          float digit,
          vec2 uv,
          float shade,
          float movingOpacity,
          float motionBlur
        ) {
          vec2 shadowOffset = vec2(1.56784 / 209.72, 1.56784 / 305.28);
          float dayTheme = step(0.5, u_theme);
          float shadow = 0.0;
          if (dayTheme < 0.5) {
            shadow = digitMaskMotionBlur(
              digit,
              uv - shadowOffset,
              motionBlur
            ) * movingOpacity;
          }
          float glyph = digitMaskMotionBlur(
            digit,
            uv,
            motionBlur
          ) * movingOpacity;
          /*
            The light card uses no number shadow. Besides matching the day
            artwork, removing this second dark silhouette prevents a visible
            trail when the flap is compressed into the fold.
          */
          float shadowStrength = mix(0.20, 0.0, dayTheme);
          vec3 c = mix(base, vec3(0.0), shadow * shadowStrength);
          vec3 digitColor = mix(
            NIGHT_DIGIT,
            DAY_DIGIT,
            dayTheme
          );
          c = mix(c, digitColor * shade, glyph);
          return vec4(c, glyph);
        }

        vec4 digitLayer(vec3 base, float digit, vec2 uv, float shade) {
          return digitLayerOpacity(base, digit, uv, shade, 1.0, 0.0);
        }

        vec2 digitUVFromCard(vec2 cardUV) {
          /*
            The visible card is clipped to the 293.93px group, while the
            Figma number layer still uses Group 48622's 305.28px height and
            -11.34px top. Keeping those coordinate systems separate preserves
            the exact font baseline from the reference PNG.
          */
          return vec2(cardUV.x, (cardUV.y * GROUP.y + 11.34) / 305.28);
        }

        vec4 flatHalf(vec2 uv, float digit, float side) {
          return digitLayer(cardSurface(uv, side), digit, digitUVFromCard(uv), 1.0);
        }

        vec4 renderCard(vec2 uv, float oldDigit, float newDigit, float side) {
          float p = clamp(u_progress, 0.0, 1.0);

          /*
            Do not animate a card whose digit did not change. During a rapid
            countdown this keeps the tens card perfectly still on 29→28,
            28→27, etc., eliminating the most visible duplicate-digit trail.
          */
          if (p <= 0.0001 || abs(oldDigit - newDigit) < 0.1) {
            return flatHalf(uv, oldDigit, side);
          }

          /* 翻页期间：上半已经显示新数字，下半仍显示旧数字。 */
          float baseDigit = uv.y < 0.5 ? newDigit : oldDigit;
          vec4 color = flatHalf(uv, baseDigit, side);

          if (p < 0.5) {
            /* 第一段：旧数字上半片围绕中轴向下翻，投影高度逐渐压缩。 */
            float t = p * 2.0;
            float eased = t * t * (3.0 - 2.0 * t);
            float flapH = max(0.0012, 0.5 * (1.0 - eased));
            float flapTop = 0.5 - flapH;

            if (uv.y >= flapTop && uv.y <= 0.5) {
              float fy = (uv.y - flapTop) / flapH;
              vec2 sourceUV = vec2(uv.x, fy * 0.5);
              float barrel = sin(fy * 3.14159265);
              float shade = mix(1.0, 0.22, eased) * (0.93 - barrel * 0.10);
              float dayFlapOpacity = smoothstep(0.075, 0.30, flapH);
              float movingOpacity = mix(
                1.0,
                dayFlapOpacity,
                step(0.5, u_theme)
              );
              float compressionCompensation =
                clamp(0.5 / max(flapH, 0.055), 1.0, 5.0);
              float motionBlur =
                u_motionBlur *
                smoothstep(0.08, 1.0, u_flipSpeed) *
                mix(0.55, 1.45, u_flipSpeed) *
                compressionCompensation *
                pow(max(0.0, sin(t * 3.14159265)), 0.62);
              color = digitLayerOpacity(
                cardSurface(sourceUV, side),
                oldDigit,
                digitUVFromCard(sourceUV),
                shade,
                movingOpacity,
                motionBlur
              );
              color.rgb *= 1.0 - barrel * eased * 0.16;
            }

            float edge = exp(-abs(uv.y - flapTop) * 220.0);
            color.rgb += edge * vec3(0.08) * (1.0 - eased);
          } else {
            /* 第二段：新数字下半片从中轴展开到下方。 */
            float t = (p - 0.5) * 2.0;
            float eased = t * t * (3.0 - 2.0 * t);
            float flapH = max(0.0012, 0.5 * eased);
            float flapBottom = 0.5 + flapH;

            if (uv.y >= 0.5 && uv.y <= flapBottom) {
              float fy = (uv.y - 0.5) / flapH;
              vec2 sourceUV = vec2(uv.x, 0.5 + fy * 0.5);
              float barrel = sin(fy * 3.14159265);
              float shade = mix(0.22, 1.0, eased) * (0.88 + barrel * 0.08);
              float dayFlapOpacity = smoothstep(0.085, 0.31, flapH);
              float movingOpacity = mix(
                1.0,
                dayFlapOpacity,
                step(0.5, u_theme)
              );
              float compressionCompensation =
                clamp(0.5 / max(flapH, 0.055), 1.0, 5.0);
              float motionBlur =
                u_motionBlur *
                smoothstep(0.08, 1.0, u_flipSpeed) *
                mix(0.55, 1.45, u_flipSpeed) *
                compressionCompensation *
                pow(max(0.0, sin(t * 3.14159265)), 0.62);
              color = digitLayerOpacity(
                cardSurface(sourceUV, side),
                newDigit,
                digitUVFromCard(sourceUV),
                shade,
                movingOpacity,
                motionBlur
              );
              color.rgb *= 1.0 - barrel * (1.0 - eased) * 0.18;
            }

            float edge = exp(-abs(uv.y - flapBottom) * 200.0);
            color.rgb *= 1.0 - edge * 0.18 * (1.0 - eased);
          }

          return color;
        }

        void main() {
          /* 统一使用左上角为原点的设计坐标，和 Figma 一致。 */
          vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);
          vec2 viewPx = uv * VIEW;
          vec2 designPx = viewPx - GROUP_ORIGIN;

          vec3 outColor = vec3(0.0);
          float outAlpha = 0.0;

          for (int i = 0; i < 2; i++) {
            float cardX = i == 0 ? 0.0 : 220.29;       /* 51.23% × 430 */
            float cardY = 0.0;
            float cardW = 209.72;
            float cardH = 293.93;
            float radius = 8.44633;

            vec2 centerPx =
              GROUP_ORIGIN + vec2(cardX + cardW * 0.5, cardY + cardH * 0.5);
            vec2 halfPx = vec2(cardW, cardH) * 0.5;
            vec2 p = viewPx - centerPx;
            float d = roundedBoxSDF(p, halfPx, radius);

            if (d <= 0.0) {
              vec2 local = (designPx - vec2(cardX, cardY)) / vec2(cardW, cardH);
              /*
                The reference has a real transparent cut between the halves.
                Nothing is rendered here—not the card, border, or digit.
              */
              float foldCutHalf = 1.0 / cardH;
              if (abs(local.y - 0.5) >= foldCutHalf) {
                float oldDigit = i == 0 ? u_from.x : u_from.y;
                float newDigit = i == 0 ? u_to.x : u_to.y;

                /*
                  Intro sequence uses -1 as a transparent card sentinel.
                  During this first reveal, bypass renderCard completely so the
                  card stays flat and static. Only its overall alpha changes.
                */
                bool isIntroReveal = oldDigit < -0.5 && newDigit >= -0.5;
                float introVisibility = 1.0;
                vec4 rendered;
                if (isIntroReveal) {
                  rendered = flatHalf(local, newDigit, float(i));
                  float introProgress = clamp(u_progress, 0.0, 1.0);
                  introVisibility = smoothstep(0.0, 1.0, introProgress);
                } else {
                  rendered = renderCard(local, oldDigit, newDigit, float(i));
                }
                vec3 card = rendered.rgb;

                /*
                  Each half has its own directional outline:
                  upper card = bright top → dark fold;
                  lower card = dark fold → bright bottom.
                */
                float outerBorder = 1.0 - smoothstep(0.0, 1.35, -d);
                float foldDistancePx =
                  (abs(local.y - 0.5) - foldCutHalf) * cardH;
                float foldBorder =
                  1.0 - smoothstep(0.0, 1.10, foldDistancePx);
                float border = max(outerBorder, foldBorder);

                float borderLight = local.y < 0.5
                  ? 1.0 - local.y * 2.0
                  : (local.y - 0.5) * 2.0;
                borderLight = pow(clamp(borderLight, 0.0, 1.0), 0.72);
                float dayTheme = step(0.5, u_theme);
                vec3 borderDark = mix(
                  vec3(0.10, 0.15, 0.18),
                  vec3(0.72, 0.61, 0.04),
                  dayTheme
                );
                vec3 borderBright = mix(
                  vec3(0.76, 0.84, 0.85),
                  vec3(1.0),
                  dayTheme
                );
                vec3 borderColor = mix(borderDark, borderBright, borderLight);
                card = mix(card, borderColor, border);

                outColor = card * introVisibility;
                /*
                  Mode 1 is real alpha transparency. The yellow digit and
                  outside outline remain solid while the card reveals the
                  live CSS background underneath.
                */
                float nightTheme = 1.0 - step(0.5, u_theme);
                float glassMode =
                  step(0.5, u_cardMode) *
                  (1.0 - step(1.5, u_cardMode)) *
                  nightTheme;
                float figmaGlassAlpha =
                  clamp(figmaGlassMaterial(local).a * u_glassOpacity, 0.0, 0.92);
                float materialAlpha =
                  mix(1.0, figmaGlassAlpha, glassMode);
                float solidDetail = clamp(max(rendered.a, border), 0.0, 1.0);
                outAlpha = mix(materialAlpha, 1.0, solidDetail) * introVisibility;
              }
            }
          }

          /* Keep the drawing buffer valid for premultiplied-alpha compositing. */
          gl_FragColor = vec4(outColor * outAlpha, outAlpha);
        }
      `;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader) || "Shader 编译失败";
          gl.deleteShader(shader);
          throw new Error(message);
        }
        return shader;
      }

      function createProgram() {
        const program = gl.createProgram();
        const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
        const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        gl.deleteShader(vertex);
        gl.deleteShader(fragment);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || "Shader 链接失败");
        }
        return program;
      }

      async function createDigitAtlas() {
        const atlas = new Image();
        const ready = new Promise((resolve, reject) => {
          atlas.onload = resolve;
          atlas.onerror = () => reject(new Error("内嵌数字纹理图集解析失败。"));
        });
        atlas.src = "data:image/png;base64," +
          document.querySelector("#digit-atlas-source").textContent.trim();
        await ready;

        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return texture;
      }

      function svgElement(name) {
        return document.createElementNS("http://www.w3.org/2000/svg", name);

      function canvasToBlob(canvas) {
        return new Promise(resolve => {
          canvas.toBlob(blob => resolve(blob), "image/png");
        });

      async function rasterizeSvgGroup(group, className, padding = 24) {
        if (!group || !figmaDecoration) return null;

        const rawBox = group.getBBox();
        const box = {
          x: rawBox.x - padding,
          y: rawBox.y - padding,
          width: rawBox.width + padding * 2,
          height: rawBox.height + padding * 2
        };
        const cloneSvg = svgElement("svg");
        cloneSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        cloneSvg.setAttribute("width", String(box.width));
        cloneSvg.setAttribute("height", String(box.height));
        cloneSvg.setAttribute(
          "viewBox",
          `${box.x} ${box.y} ${box.width} ${box.height}`
        );
        cloneSvg.setAttribute("overflow", "visible");

        const defs = figmaDecoration.querySelector("defs");
        if (defs) cloneSvg.appendChild(defs.cloneNode(true));

        const clone = group.cloneNode(true);
        clone.removeAttribute("class");
        clone.removeAttribute("style");
        clone.setAttribute("opacity", "1");
        clone.setAttribute("transform", "none");
        /* A bitmap cannot reproduce live backdrop-filter content reliably. */
        clone.querySelectorAll("foreignObject").forEach(node => node.remove());
        clone.querySelectorAll(".prelaunch-shiny-local").forEach(node => node.remove());
        cloneSvg.appendChild(clone);

        const serialized = new XMLSerializer().serializeToString(cloneSvg);
        const svgBlob = new Blob([serialized], { type: "image/svg+xml;charset=utf-8" });
        const svgUrl = URL.createObjectURL(svgBlob);

        try {
          const sourceImage = new Image();
          sourceImage.decoding = "async";
          sourceImage.src = svgUrl;
          await sourceImage.decode();

          const rasterScale = 3;
          const rasterCanvas = document.createElement("canvas");
          rasterCanvas.width = Math.max(1, Math.ceil(box.width * rasterScale));
          rasterCanvas.height = Math.max(1, Math.ceil(box.height * rasterScale));
          const context = rasterCanvas.getContext("2d", { alpha: true });
          context.setTransform(rasterScale, 0, 0, rasterScale, 0, 0);
          context.drawImage(sourceImage, 0, 0, box.width, box.height);

          const pngBlob = await canvasToBlob(rasterCanvas);
          if (!pngBlob) return null;
          const pngUrl = URL.createObjectURL(pngBlob);
          prelaunchRasterUrls.push(pngUrl);

          const image = document.createElement("img");
          image.className = className;
          image.alt = "";
          image.draggable = false;
          image.src = pngUrl;
          image.style.left = `${box.x / 569 * 100}%`;
          image.style.top = `${box.y / 594 * 100}%`;
          image.style.width = `${box.width / 569 * 100}%`;
          image.style.height = `${box.height / 594 * 100}%`;
          await image.decode();
          return image;
        } finally {
          URL.revokeObjectURL(svgUrl);
        }
      }

          rasterizeSvgGroup(revealCopyGroup, "prelaunch-raster-copy", 28)

          const layer = document.createElement("div");

          layer.setAttribute("aria-hidden", "true");

          heroContent.appendChild(layer);

          prelaunchRasterReady = true;
          return true;

          console.warn("Prelaunch raster optimization unavailable:", error);
          return false;
        });
        return prelaunchRasterPromise;

          0,

          launchShinyDirectionInput.value === "right";

        const token = ++prelaunchShinyToken;
        const startedAt = performance.now();
        const cycleDuration = speedMs + delayMs;

        const targets = [
          {
            gradient: prelaunchLogoShinyGradient,
            centerX: 284.5,
            centerY: 34,
            travel: 340

            gradient: prelaunchCopyShinyGradient,
            centerX: 284.5,
            centerY: 520,
            travel: 520

          if (token !== prelaunchShinyToken) return;
          const elapsed = now - startedAt;
          let progress = 0;

          if (yoyo) {
            const fullCycle = cycleDuration * 2;
            const cycleTime = elapsed % fullCycle;
            if (cycleTime < speedMs) {
              progress = cycleTime / speedMs;
            } else if (cycleTime < cycleDuration) {
              progress = 1;
            } else if (cycleTime < cycleDuration + speedMs) {
              progress = 1 -
                (cycleTime - cycleDuration) / speedMs;
            } else {
              progress = 0;
            }
          } else {
            const cycleTime = elapsed % cycleDuration;
            progress = cycleTime < speedMs
              ? cycleTime / speedMs
              : 1;
          }

          if (reverseDirection) progress = 1 - progress;

          /* Same 150% -> -50% mapping used by React Bits ShinyText. */
          const backgroundPosition = 150 - progress * 200;
          const normalizedOffset = (backgroundPosition - 50) / 100;

          targets.forEach(target => {
            const offset = normalizedOffset * target.travel;
            target.gradient.setAttribute(
              "gradientTransform",
              `translate(${target.centerX} ${target.centerY}) ` +
              `rotate(${svgAngle}) translate(${offset} 0)`
            );
          });

          prelaunchShinyFrame = requestAnimationFrame(renderShiny);

      function finishLaunchIntroSequence() {

      function digitsOf(number) {
        const safe = Math.max(0, Math.min(99, Math.round(Number(number) || 0)));

      function easeFlip(t) {

          : 1.0 - 0.5 * Math.pow((1.0 - t) * 2.0, 1.65);

        next,
        now = performance.now(),
        stepInterval = Number(initialSpeedInput.value),
        kind = "countdown",
        durationOverride = 0

        toDigits = digitsOf(next);
        value = next;
        activeStepInterval = stepInterval;
        activeAnimationKind = kind;
        activeAnimationDuration = Math.max(0, Number(durationOverride) || 0);

          The opening 30 is already a complete, static card. Its appearance is

      function countdownStepInterval() {
        const initialInterval = Number(initialSpeedInput.value);
        const finalInterval = Math.max(
          initialInterval,
          Number(finalSpeedInput.value)
        );
        if (countdownTarget === null) return initialInterval;

        const remaining = value - countdownTarget;
        const slowAt = Math.max(2, Number(slowdownStartInput.value));
        if (remaining > slowAt) return initialInterval;

        /*
          t is 0 before the slowdown zone and reaches 1 on the final flip.
          "减速幅度" blends a linear ramp into a more dramatic cubic ramp:
          endpoints stay exact while the motion becomes more strongly staged.
        */
        const t = Math.max(
          0,
          Math.min(1, (slowAt - remaining + 1) / slowAt)
        );
        const amount = Number(slowdownAmountInput.value) / 100;
        const curvedT =
          t * (1.0 - amount) + t * t * t * amount;
        return initialInterval +
          (finalInterval - initialInterval) * curvedT;
